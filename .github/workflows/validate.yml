name: Odoo native validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        odoo: ['19.0', '20.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install, transport, MIME, access and lifecycle validation
        env:
          ODOO_TEST_VERSION: '${{ matrix.odoo }}'
          ODOO_LIFECYCLE_TESTS: '1'
        run: python3 tests/run.py
